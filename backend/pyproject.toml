[project]
name = "deltaweb-backend"
version = "0.2.0"
description = "REST API for ProyectoDeltaWeb: delta-matroids from symmetric and skew-symmetric matrices."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "numpy>=2.5.3",
    "pydantic-settings>=2.6",
    "python-flint>=0.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deltaweb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["deltaweb"]
mypy_path = "src"
