# Alembic: database migrations. Run from backend/, e.g.
#   uv run alembic upgrade head
#   uv run alembic revision --autogenerate -m "create folders"
# The database URL comes from DELTAWEB_DATABASE_URL (see migrations/env.py), not from here.

[alembic]
script_location = %(here)s/migrations
# 0001_create_users.py, 0002_..., in the order they apply
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = src
# How to split multiple paths above (os.pathsep). Without it, newer Alembic warns.
path_separator = os

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
